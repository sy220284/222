name: 生成 Rust 锁文件与规范格式（临时）
on:
  push:
    branches: [feat/full-rust-parity]
permissions:
  contents: write
concurrency:
  group: rust-ci-bootstrap
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前开发分支
        uses: actions/checkout@v4
        with:
          ref: feat/full-rust-parity
          fetch-depth: 0
      - name: 安装 Rust 格式化组件
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 生成真实依赖锁文件并规范化 Rust 格式
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock src tests
          if git diff --cached --quiet; then
            echo "依赖锁文件和格式均已同步"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "提交 Rust 依赖锁文件并规范化源码格式"
          git fetch origin feat/full-rust-parity
          git rebase origin/feat/full-rust-parity
          git push origin HEAD:feat/full-rust-parity
