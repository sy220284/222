name: 安卓 Codex 完整 APK 构建和验证

on:
  push:
    paths:
      - "android-app/**"
      - "codex-rs/cli/Cargo.toml"
      - "codex-rs/app-server/Cargo.toml"
      - "codex-rs/mxc-sandbox/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - ".github/workflows/android-codex.yml"
  workflow_dispatch:

# Only the newest commit on a branch needs expensive Rust + Android builds.
concurrency:
  group: android-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-ui:
    name: Compose UI 与 Java 独立编译检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: 校验 Codex 全量 RPC 功能目录与源码同步
        run: python3 android-app/tools/generate_protocol_catalog.py --check
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: 编译安卓 UI 源码
        working-directory: android-app
        run: gradle --no-daemon :app:unpackCodexExperimentalSchemas :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:testDebugUnitTest

  android-apk:
    name: 源码交叉编译、原生 APK 和产物校验
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Android SDK 和 NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: 安装 Rust Android ARM64 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - name: 复用 Android ARM64 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> target"
          shared-key: codex-appserver-android-arm64
          cache-on-failure: true
          cache-bin: false
      - name: 检查 Android Rust 依赖锁定
        working-directory: codex-rs
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: 编译官方 Codex App Server 原生核心
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$BIN/llvm-ranlib"
          export AR="$BIN/llvm-ar"
          export RANLIB="$BIN/llvm-ranlib"
          # OpenSSL configure invokes GNU-style prefixed binutils; NDK ships LLVM binutils.
          mkdir -p "$RUNNER_TEMP/android-cross-tools"
          for tool in ar ranlib nm strip; do
            ln -s "$BIN/llvm-$tool" "$RUNNER_TEMP/android-cross-tools/aarch64-linux-android-$tool"
          done
          export PATH="$RUNNER_TEMP/android-cross-tools:$BIN:$PATH"
          export CARGO_BUILD_JOBS=3
          export CARGO_PROFILE_RELEASE_DEBUG=0
          cargo build --release --locked --target aarch64-linux-android -p codex-app-server --bin codex-app-server
      - name: 校验原生执行文件并装入 APK
        shell: bash
        run: |
          set -euo pipefail
          ELF="codex-rs/target/aarch64-linux-android/release/codex-app-server"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -s "$ELF"
          "$READELF" -h "$ELF" | tee /tmp/codex-elf-header.txt
          grep -q 'AArch64' /tmp/codex-elf-header.txt
          grep -q 'DYN' /tmp/codex-elf-header.txt
          install -Dm755 "$ELF" "android-app/app/src/main/jniLibs/arm64-v8a/libcodex.so"
      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: 编译 Android UI、资源及 APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
      - name: 验证 APK 包含 Codex 本体
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z -1 "$APK" | grep -q '^lib/arm64-v8a/libcodex\.so$'
          unzip -p "$APK" lib/arm64-v8a/libcodex.so > /tmp/codex-from-apk
          cmp /tmp/codex-from-apk codex-rs/target/aarch64-linux-android/release/codex-app-server
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          echo "APK 原生核心一致性验证通过"
      - name: 发布可安装测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-arm64-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
