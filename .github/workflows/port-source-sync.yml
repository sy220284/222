name: 一次性迁移源码快照
on:
  push:
    branches: [feat/full-rust-parity]
    paths: [.github/workflows/port-source-sync.yml]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 导出当前 Git 版本
        shell: bash
        run: |
          git archive --format=tar.gz HEAD -o /tmp/port-current.tar.gz
          git rev-parse HEAD > /tmp/port-current.sha
      - uses: actions/upload-artifact@v4
        with:
          name: port-current-repository
          path: |
            /tmp/port-current.tar.gz
            /tmp/port-current.sha
          retention-days: 1
