name: Rust 检查与测试

on:
  pull_request:
    branches: [main, feat/full-rust-parity]
  push:
    branches: [main, pr7]

permissions:
  contents: read
  actions: read

# Verify only the current PR revision. A newer push invalidates old-head
# acceptance evidence; cancel stale Linux/Windows runs so the latest complete
# test suite starts promptly without reducing any current-head coverage.
concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 格式与静态分析
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 核对全量迁移台账与新增验收证据
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/port_workbench.py check --repo .
          python3 scripts/port_workbench.py reachability --repo . --output .port-audit
          python3 scripts/port_workbench.py dashboard --repo . --output .port-audit --changed-from-git
          python3 scripts/sync_spec_progress_summary.py --repo .
          python3 -m unittest discover -s tests/port_workbench -p 'test_*.py'
      - name: 保存迁移工作台报告和本次改动复验范围
        uses: actions/upload-artifact@v4
        with:
          name: port-workbench-dashboard
          path: |
            .port-audit/PORT_DASHBOARD.json
            .port-audit/PORT_DASHBOARD.md
          if-no-files-found: error
      - name: 保留自动生成模块调用路径审计结果
        uses: actions/upload-artifact@v4
        with:
          name: generated-ports-reachability
          path: .port-audit/generated-reachability.json
          if-no-files-found: error
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy 严格检查
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious


  model-providers:
    name: 模型品牌与 ChatGPT 登录专项验收
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 模型配置、目录、协议与 ChatGPT OAuth 逻辑
        run: |
          cargo test --locked --bin atlas-agent config::tests
          cargo test --locked --bin atlas-agent model_catalog::tests
          cargo test --locked --bin atlas-agent chatgpt_plan::tests
          cargo test --locked --bin atlas-agent provider::tests
      - name: 品牌、鉴权、实时型号选择与参数全链路
        run: |
          cargo test --locked --test domestic_models_cli
          cargo test --locked --test model_catalog_setup_cli

  audit-regression:
    name: 审计修复专项 Rust 行为测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: MCP 超大 JSON/流式响应边界
        run: |
          cargo test --locked --bin atlas-agent oversized_json_tool_result_is_bounded_before_body_read
          cargo test --locked --bin atlas-agent streamed_json_tool_result_is_bounded_without_content_length
      - name: 本地 SDK 队列顺序、通知隔离与取消恢复
        run: |
          set -euo pipefail
          cargo test --locked --bin atlas-agent -- --list > /tmp/available-queue-tests.txt
          for case in \
            message_queue::tests::priority_fifo_and_nonmatching_agent_isolation \
            sdk_queue::notification_tests::background_notifications_cannot_spoof_new_user_commands \
            query_guard::tests::cancelling_or_forcing_end_invalidates_stale_finally
          do
            grep -Fxq "$case: test" /tmp/available-queue-tests.txt
            cargo test --locked --bin atlas-agent "$case" -- --exact
          done
      - name: 模型密钥与 Gemini 流式配置
        run: |
          cargo test --locked --bin atlas-agent credentialed_endpoints_require_tls_except_loopback
          cargo test --locked --bin atlas-agent gemini_streaming_preserves_native_json_schema_and_thinking_budget
          cargo test --locked --bin atlas-agent rejects_url_credentials_and_reserved_headers_without_network

  test:
    name: 编译与全部测试
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 锁文件与依赖一致性
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: 编译全部目标
        run: cargo check --locked --all-targets
      - name: Linux Rust 单元测试
        timeout-minutes: 8
        run: cargo test --locked --bins
      # Automatically discover every integration test target; newly ported SDK,
      # MCP and CLI behavior must never bypass the Linux/Windows gate.
      - name: Linux 全部集成测试（自动发现）
        timeout-minutes: 20
        run: cargo test --locked --tests


  windows-check:
    name: Windows Shell 与跨平台编译
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 检查 Windows 全部编译目标
        run: cargo check --locked --all-targets
      - name: Windows Rust 单元测试
        timeout-minutes: 8
        run: cargo test --locked --bins
      # Automatically discover every integration test target; newly ported SDK,
      # MCP and CLI behavior must never bypass the Linux/Windows gate.
      - name: Windows 全部集成测试（自动发现）
        timeout-minutes: 20
        run: cargo test --locked --tests

  security:
    name: 依赖漏洞与来源检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: RustSec 安全公告审计
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features

  source-parity:
    name: 原版源码全量等价验收
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出当前提交
        uses: actions/checkout@v4
      # Publish the complete gap list even if private source credentials are
      # absent; a successful report never changes the strict gate result.
      - name: 输出源码逐函数差异清单（只报告，不放行）
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_parity_gate.py report --repo . --output .port-audit
          cat .port-audit/SOURCE_PARITY.md >> "$GITHUB_STEP_SUMMARY"
      - name: 获取私密 2.1.88 原版源码
        shell: bash
        env:
          SOURCE_URL: ${{ secrets.ORIGINAL_SOURCE_ARCHIVE_URL }}
          SOURCE_SHA256: ${{ secrets.ORIGINAL_SOURCE_ARCHIVE_SHA256 }}
          SOURCE_TOKEN: ${{ secrets.ORIGINAL_SOURCE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .port-audit
          if [[ -z "$SOURCE_URL" || -z "$SOURCE_SHA256" ]]; then
            echo "::error::未配置可信的原版源码与哈希，禁止放行"
            exit 1
          fi
          [[ "$SOURCE_URL" == https://* ]] || { echo "::error::必须使用 HTTPS 原版源码地址"; exit 1; }
          [[ "$SOURCE_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::原版 ZIP SHA256 非法"; exit 1; }
          if [[ -n "$SOURCE_TOKEN" ]]; then
            curl --fail --silent --show-error --proto '=https' --max-redirs 0 --max-time 240 \
              --header "Authorization: Bearer $SOURCE_TOKEN" "$SOURCE_URL" -o "$RUNNER_TEMP/original.zip"
          else
            curl --fail --silent --show-error --proto '=https' --max-redirs 0 --max-time 240 \
              "$SOURCE_URL" -o "$RUNNER_TEMP/original.zip"
          fi
          echo "$SOURCE_SHA256  $RUNNER_TEMP/original.zip" | sha256sum -c -
      - name: 原版源码逐文件、逐函数和 Rust 行为证据门禁
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/source_parity_gate.py gate --repo . \
            --source-archive "$RUNNER_TEMP/original.zip" --output .port-audit
      - name: 保存独立验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandatory-source-parity
          path: .port-audit/
          if-no-files-found: warn
