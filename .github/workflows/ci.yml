name: Rust 检查与测试

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 格式与静态分析
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 核对全量迁移台账与新增验收证据
        run: |
          python3 scripts/port_workbench.py check --repo .
          python3 -m unittest discover -s tests/port_workbench -p 'test_*.py'
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy 严格检查
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

  test:
    name: 编译与全部测试
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 锁文件与依赖一致性
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: 编译全部目标
        run: cargo check --locked --all-targets
      - name: 运行完整单元与集成测试
        run: cargo test --locked --all-targets


  windows-check:
    name: Windows Shell 与跨平台编译
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 检查 Windows 全部编译目标
        run: cargo check --locked --all-targets
      - name: Windows 进程与工具链回归
        run: cargo test --locked --all-targets

  security:
    name: 依赖漏洞与来源检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: RustSec 安全公告审计
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
