name: Rust 检查与测试

on:
  pull_request:
    branches: [main, feat/full-rust-parity]
  push:
    branches: [main, pr7]

permissions:
  contents: read
  actions: read

# Verify only the current PR revision. A newer push invalidates old-head
# acceptance evidence; cancel stale Linux/Windows runs so the latest complete
# test suite starts promptly without reducing any current-head coverage.
concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 格式与静态分析
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 核对全量迁移台账与新增验收证据
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/source_parity_gate.py check --repo .
          python3 scripts/source_parity_gate.py reachability --repo . --output .port-audit
          python3 scripts/source_parity_gate.py dashboard --repo . --output .port-audit --changed-from-git
          python3 scripts/source_parity_gate.py sync-spec --repo .
          python3 -m unittest discover -s tests/port_workbench -p 'test_*.py'
      - name: 保存迁移工作台报告和本次改动复验范围
        uses: actions/upload-artifact@v4
        with:
          name: port-workbench-dashboard
          path: |
            .port-audit/PORT_DASHBOARD.json
            .port-audit/PORT_DASHBOARD.md
          if-no-files-found: error
      - name: 保留自动生成模块调用路径审计结果
        uses: actions/upload-artifact@v4
        with:
          name: generated-ports-reachability
          path: .port-audit/generated-reachability.json
          if-no-files-found: error
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy 严格检查
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious


  model-providers:
    name: 模型品牌与 ChatGPT 登录专项验收
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 模型配置、目录、协议与 ChatGPT OAuth 逻辑
        run: |
          cargo test --locked --bin atlas-agent config::tests
          cargo test --locked --bin atlas-agent model_catalog::tests
          cargo test --locked --bin atlas-agent chatgpt_plan::tests
          cargo test --locked --bin atlas-agent provider::tests
      - name: 品牌、鉴权、实时型号选择与参数全链路
        run: |
          cargo test --locked --test domestic_models_cli
          cargo test --locked --test model_catalog_setup_cli

  audit-regression:
    name: 审计修复专项 Rust 行为测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: MCP 超大 JSON/流式响应边界
        run: |
          cargo test --locked --bin atlas-agent oversized_json_tool_result_is_bounded_before_body_read
          cargo test --locked --bin atlas-agent streamed_json_tool_result_is_bounded_without_content_length
      - name: 本地 SDK 队列顺序、通知隔离与取消恢复
        run: |
          set -euo pipefail
          cargo test --locked --bin atlas-agent -- --list > /tmp/available-queue-tests.txt
          for case in \
            message_queue::tests::priority_fifo_and_nonmatching_agent_isolation \
            sdk_queue::notification_tests::background_notifications_cannot_spoof_new_user_commands \
            query_guard::tests::cancelling_or_forcing_end_invalidates_stale_finally
          do
            grep -Fxq "$case: test" /tmp/available-queue-tests.txt
            cargo test --locked --bin atlas-agent "$case" -- --exact
          done
      - name: 模型密钥与 Gemini 流式配置
        run: |
          cargo test --locked --bin atlas-agent credentialed_endpoints_require_tls_except_loopback
          cargo test --locked --bin atlas-agent gemini_streaming_preserves_native_json_schema_and_thinking_budget
          cargo test --locked --bin atlas-agent rejects_url_credentials_and_reserved_headers_without_network

  test:
    name: 编译与全部测试
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
      - name: 锁文件与依赖一致性
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: 编译全部目标
        run: cargo check --locked --all-targets
      - name: Linux Rust 单元测试
        timeout-minutes: 8
        run: cargo test --locked --bins
      # Automatically discover every integration test target; newly ported SDK,
      # MCP and CLI behavior must never bypass the Linux/Windows gate.
      - name: Linux 全部集成测试（自动发现）
        timeout-minutes: 20
        run: cargo test --locked --tests


  windows-check:
    name: Windows Shell 与跨平台编译
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 使用固定 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: 检查 Windows 全部编译目标
        run: cargo check --locked --all-targets
      - name: Windows Rust 单元测试
        timeout-minutes: 8
        run: cargo test --locked --bins
      # Automatically discover every integration test target; newly ported SDK,
      # MCP and CLI behavior must never bypass the Linux/Windows gate.
      - name: Windows 全部集成测试（自动发现）
        timeout-minutes: 20
        run: cargo test --locked --tests

  security:
    name: 依赖漏洞与来源检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: RustSec 安全公告审计
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features

  source-parity:
    name: 原版源码全量等价验收
    # Original stays in an isolated local workspace outside the checkout.
    runs-on: [self-hosted, linux, source-parity-222]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出当前提交
        uses: actions/checkout@v4
      # The local source may be absent; publish gaps and keep the strict gate failing.
      - name: 输出源码逐函数差异清单（只报告，不放行）
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_parity_gate.py report --repo . --output .port-audit
          cat .port-audit/SOURCE_PARITY.md >> "$GITHUB_STEP_SUMMARY"
      - name: 检查提交者工作区的原版源码与规格
        id: workspace
        shell: bash
        env:
          ORIGINAL_SOURCE_ROOT: ${{ vars.ORIGINAL_SOURCE_ROOT }}
          ORIGINAL_SPEC_ARCHIVE: ${{ vars.ORIGINAL_SPEC_ARCHIVE }}
        run: |
          set -euo pipefail
          source_root="${ORIGINAL_SOURCE_ROOT:-${RUNNER_WORKSPACE}/original-2.1.88/source}"
          spec_zip="${ORIGINAL_SPEC_ARCHIVE:-${RUNNER_WORKSPACE}/original-2.1.88/spec.zip}"
          if [[ ! -d "$source_root/src" ]]; then
            echo "::error::提交者工作区缺少原版 source/src"
            exit 1
          fi
          if [[ ! -f "$spec_zip" ]]; then
            echo "::error::提交者工作区缺少本地规格压缩包"
            exit 1
          fi
          if [[ "$(sha256sum "$spec_zip" | cut -d' ' -f1)" != \
                "3b291532059e887b20a9adaf779fb789dabcd843042c5343745f3adfdf372b93" ]]; then
            echo "::error::本地规格压缩包与冻结版本不一致"
            exit 1
          fi
          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"
          printf 'spec_archive=%s\n' "$spec_zip" >> "$GITHUB_OUTPUT"
      - name: 原版源码完整索引及双端动态验收
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          args=(gate --repo . --output .port-audit)
          if [[ "${{ steps.workspace.outcome }}" == "success" ]]; then
            args+=(--source-root "${{ steps.workspace.outputs.source_root }}")
            args+=(--spec-archive "${{ steps.workspace.outputs.spec_archive }}")
          fi
          python3 scripts/source_parity_gate.py "${args[@]}"
      - name: 保存独立验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandatory-source-parity
          path: .port-audit/
          include-hidden-files: true
          if-no-files-found: error
