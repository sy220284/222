name: 导出本地核验快照
on:
  push:
    branches: [feat/full-rust-parity]
    paths:
      - '.github/workflows/port-snapshot.yml'
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 封装仓库完整代码快照
        run: |
          git archive --format=tar -o 222-code.tar HEAD~1
          gzip -9 222-code.tar
          git rev-parse HEAD~1 > 222-snapshot-base.sha
      - name: 构建离线本地 Rust 检查工具链与依赖包
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          cargo vendor --locked --versioned-dirs vendor > offline-vendor.toml
          TOOLCHAIN_DIR="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -czf rust-toolchain.tar.gz -C "$(dirname "$TOOLCHAIN_DIR")" "$(basename "$TOOLCHAIN_DIR")"
          tar -czf rust-vendor.tar.gz vendor
          echo "toolchain: $(du -h rust-toolchain.tar.gz | cut -f1); vendor: $(du -h rust-vendor.tar.gz | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-port-local-offline-bundle
          path: |
            222-code.tar.gz
            222-snapshot-base.sha
            offline-vendor.toml
            rust-toolchain.tar.gz
            rust-vendor.tar.gz
          retention-days: 1
