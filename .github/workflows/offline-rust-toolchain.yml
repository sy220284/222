name: 222 Rust 1.99.1 分卷离线工具链产物
on:
  push:
    branches: [tooling/offline-rust-1-99-1-20261030]
  pull_request:
    branches: [main]
    paths: [.github/workflows/offline-rust-toolchain.yml]

permissions:
  contents: read

jobs:
  offline-toolchain:
    name: 构建并校验 Linux x86_64 Rust 工具链分卷
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 下载 Rust 1.99.1 及项目依赖
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          rustc --version
          cargo --version
          cargo clippy --version
      - name: 打包并分卷以便无网络容器下载
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          tc="1.99.1-x86_64-unknown-linux-gnu"
          test -x "$HOME/.rustup/toolchains/$tc/bin/rustc"
          mkdir -p dist
          tar -C "$HOME" -I 'zstd -T0 -8' -cf dist/222-rust-toolchain-linux-x86_64.tar.zst ".rustup/toolchains/$tc"
          tar -C "$HOME" -I 'zstd -T0 -8' -cf dist/222-cargo-registry-linux-x86_64.tar.zst ".cargo/registry"
          git archive HEAD | zstd -T0 -8 -o dist/222-source.tar.zst
          git rev-parse HEAD > dist/source-head.txt
          sha256sum dist/*.tar.zst > dist/SHA256SUMS
          split -b 64000000 -d -a 2 dist/222-rust-toolchain-linux-x86_64.tar.zst dist/toolchain.part-
          sha256sum dist/toolchain.part-* > dist/SHA256PARTS
          test -f dist/toolchain.part-00
          test -f dist/toolchain.part-01
          test -f dist/toolchain.part-02
          test "$(find dist -name 'toolchain.part-*' | wc -l)" = 3
          rm dist/222-rust-toolchain-linux-x86_64.tar.zst
          cat > dist/INSTALL.md <<'EOF'
          # 222 Rust 离线工具链分卷（Linux x86_64）

          分别下载四个 GitHub Actions Artifact：part-00、part-01、part-02、support。
          将三个 part 文件与 support 内的其他文件放在同一目录。

          ```bash
          sha256sum -c SHA256PARTS
          cat toolchain.part-00 toolchain.part-01 toolchain.part-02 > 222-rust-toolchain-linux-x86_64.tar.zst
          sha256sum -c SHA256SUMS
          mkdir -p "$HOME/222-offline"
          tar --zstd -xf 222-rust-toolchain-linux-x86_64.tar.zst -C "$HOME/222-offline"
          tar --zstd -xf 222-cargo-registry-linux-x86_64.tar.zst -C "$HOME/222-offline"
          export RUSTUP_HOME="$HOME/222-offline/.rustup"
          export CARGO_HOME="$HOME/222-offline/.cargo"
          export PATH="$RUSTUP_HOME/toolchains/1.99.1-x86_64-unknown-linux-gnu/bin:$PATH"
          export CARGO_NET_OFFLINE=true
          rustc --version
          cargo --version
          mkdir -p "$HOME/222-source"
          tar --zstd -xf 222-source.tar.zst -C "$HOME/222-source"
          cd "$HOME/222-source"
          cargo check --locked --offline --all-targets
          ```

          已有本地 222 仓库时可直接使用该工具链编译当前代码。
          EOF
          sha256sum -c dist/SHA256PARTS
          du -h dist/*
      - name: 上传工具链分卷 00
        uses: actions/upload-artifact@v4
        with:
          name: 222-rust-toolchain-part-00
          path: dist/toolchain.part-00
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: 上传工具链分卷 01
        uses: actions/upload-artifact@v4
        with:
          name: 222-rust-toolchain-part-01
          path: dist/toolchain.part-01
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: 上传工具链分卷 02
        uses: actions/upload-artifact@v4
        with:
          name: 222-rust-toolchain-part-02
          path: dist/toolchain.part-02
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: 上传校验文件、缓存与源码
        uses: actions/upload-artifact@v4
        with:
          name: 222-rust-toolchain-support
          path: |
            dist/222-cargo-registry-linux-x86_64.tar.zst
            dist/222-source.tar.zst
            dist/source-head.txt
            dist/SHA256SUMS
            dist/SHA256PARTS
            dist/INSTALL.md
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
