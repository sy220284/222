name: 导出最新本地验收快照
on:
  push:
    branches: [feat/full-rust-parity]
    paths:
      - .github/workflows/local-port-export.yml
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 制作仅含仓库代码的快照
        run: |
          mkdir -p export
          git archive --format=tar.gz HEAD -o export/current.tar.gz
          git rev-parse HEAD > export/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: latest-full-rust-port
          path: export/
          retention-days: 1
