name: 单次导入 OpenAI Codex 官方源码

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-codex:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == '初始化：导入 Codex 官方源码'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 克隆已确认的 Codex 主线提交
        env:
          UPSTREAM_SHA: 67f0994b532b8740f14b5b738af7b7b2a915b1d6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-upstream"
          git -C "$RUNNER_TEMP/codex-upstream" init -q
          git -C "$RUNNER_TEMP/codex-upstream" remote add origin https://github.com/openai/codex.git
          git -C "$RUNNER_TEMP/codex-upstream" fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/codex-upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/codex-upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          rsync -a --exclude='.git' "$RUNNER_TEMP/codex-upstream/" "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/bootstrap-codex.yml"
          cat > "$GITHUB_WORKSPACE/UPSTREAM_SNAPSHOT.md" <<EOF
          # Codex 源码快照

          - 上游仓库：https://github.com/openai/codex
          - 上游分支：main
          - 固定提交：`$UPSTREAM_SHA`
          - 上游提交链接：https://github.com/openai/codex/commit/$UPSTREAM_SHA
          - 导入方式：完整工作树（保留源文件、目录、权限和符号链接；不包含上游 Git 历史）
          - 导入时间：$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          本仓库内容来自上述固定版本，可通过原始提交精确复现。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo '导入后无文件变化'; exit 1; }
          git commit -m "导入 Codex 官方完整源码快照 $UPSTREAM_SHA"
          git push origin HEAD:main

      - name: 验证导入快照与源码一致
        env:
          UPSTREAM_SHA: 67f0994b532b8740f14b5b738af7b7b2a915b1d6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$RUNNER_TEMP/codex-upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -f "$GITHUB_WORKSPACE/codex-rs/Cargo.toml"
          test -f "$GITHUB_WORKSPACE/README.md"
          git status --porcelain
          echo "源码导入和关键文件检查通过"
