name: 审计分支专用格式统一
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/222-source-audit-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m "按固定工具链统一跨平台修复代码格式"
            git push origin HEAD:refs/heads/fix/222-source-audit-20261030
          fi
