[package]
name = "atlas-agent"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral Rust coding agent"
license = "MIT"
rust-version = "1.82"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
base64 = "0.22"
getrandom = "0.2"
regex = "1"
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
indexmap = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util", "net", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
